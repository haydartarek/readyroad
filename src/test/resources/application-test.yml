# ========================================
# Test Profile Configuration
# Uses H2 in-memory database so unit tests
# and simple @SpringBootTest classes can
# run without an external MySQL instance.
# ========================================

spring:
  application:
    name: readyroad_test

  security:
    mode: dev          # disable full security in tests

  datasource:
    url: jdbc:h2:mem:readyroad_${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop      # auto-create schema from entities
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    defer-datasource-initialization: true

  flyway:
    enabled: false               # skip Flyway - H2 schema comes from Hibernate

server:
  port: 0                         # random port for parallel test safety

# ========================================
# JWT (fixed test-only key; never use in production)
# ========================================
jwt:
  enabled: true
  secret-key: cmVhZHlyb2FkLXRlc3Qtb25seS1qd3Qtc2VjcmV0LW5vdC1mb3ItcHJvZHVjdGlvbi0yMDI2
  expiration: 3600000
  refresh-token:
    expiration: 604800000
  issuer: readyroad-test
  header: Authorization
  prefix: Bearer

readyroad:
  admin:
    default-password: test-admin-password

# ========================================
# Logging - keep it quiet
# ========================================
logging:
  level:
    root: WARN
    com.readyroad: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
