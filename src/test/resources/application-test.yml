spring:
  application:
    name: readyroad-test

  autoconfigure:
    exclude:
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop  # Let Hibernate create schema from entities
    show-sql: false
    defer-datasource-initialization: true  # Allow CommandLineRunner to run after schema creation
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: false  # Disabled: migrations are MySQL-specific, use Hibernate DDL instead

  # Security Configuration (TEST MODE - Same as DEV)
  security:
    mode: dev  # Allow test execution without JWT (override in specific tests if needed)

  h2:
    console:
      enabled: true

server:
  port: 0  # Random port for parallel test execution

# JWT Configuration for tests
jwt:
  secret: "dGVzdC1qd3Qtc2VjcmV0LWtleS1taW5pbXVtLTMyLWNoYXJhY3RlcnMtcmVxdWlyZWQtZm9yLWhzMjU2LWFsZ29yaXRobQ=="
  expiration: 86400000  # 24 hours in milliseconds

logging:
  level:
    root: INFO
    com.readyroad: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
