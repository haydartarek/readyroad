spring:
  application:
    name: readyroad-test

  autoconfigure:
    exclude:
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: false

  security:
    mode: dev

  h2:
    console:
      enabled: true

server:
  port: 0

jwt:
  secret-key: "dGVzdC1qd3Qtc2VjcmV0LWtleS1taW5pbXVtLTMyLWNoYXJhY3RlcnMtcmVxdWlyZWQtZm9yLWhzMjU2LWFsZ29yaXRobQ=="
  expiration: 86400000

logging:
  level:
    root: INFO
    com.readyroad: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
