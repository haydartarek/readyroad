# ========================================
# ReadyRoad - Development Profile
# ========================================
# All endpoints are PUBLIC (no authentication required)
# Use this profile for local development and testing
#
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ========================================

spring:
  application:
    name: readyroad-dev

  # Development Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/readyroad?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: intec-123
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Security Configuration (DEV MODE)
  security:
    mode: dev

# Server Configuration
server:
  port: 8890
  error:
    include-message: always
    include-stacktrace: on_param

# Logging Configuration
logging:
  level:
    root: INFO
    com.readyroad: DEBUG
    org.springframework.security: DEBUG

# JWT Configuration (✅ أضف هذا - مهم جداً!)
jwt:
  enabled: true
  secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351
  expiration: 86400000
  refresh-token:
    expiration: 604800000
  issuer: readyroad-backend


---
# NOTE: In dev mode, JWT is ENABLED but all endpoints remain accessible for testing
# This allows you to test both authenticated and unauthenticated flows
