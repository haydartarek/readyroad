# ========================================
# ReadyRoad - Development Profile
# ========================================
# All endpoints are PUBLIC (no authentication required)
# Use this profile for local development and testing
#
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# ========================================

spring:
  application:
    name: readyroad-dev

  # Development Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/readyroad?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: intec-123
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update  # Dev mode: Hibernate manages incremental changes (acceptable for development)
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Security Configuration (DEV MODE)
  security:
    mode: dev  # Custom property to identify dev mode

# Server Configuration
server:
  port: 8890  # Standard dev port
  error:
    include-message: always
    include-stacktrace: on_param

# Logging Configuration
logging:
  level:
    root: INFO
    com.readyroad: DEBUG
    org.springframework.security: DEBUG

# JWT Configuration (Disabled in Dev)
jwt:
  enabled: false
  secret: not-used-in-dev-mode
  expiration: 86400000  # 24 hours (not used in dev)

---

# NOTE: In dev mode, all endpoints are PUBLIC
# SecurityConfigDev will configure permitAll() for all requests
