spring:
  config:
    activate:
      on-profile: postgresql

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DATABASE:${POSTGRES_DB:readyroad_postgresql}}?sslmode=${POSTGRES_SSL_MODE:${POSTGRES_SSLMODE:disable}}&currentSchema=${POSTGRES_SCHEMA:public}
    username: ${POSTGRES_USERNAME:}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${POSTGRES_MAX_POOL_SIZE:5}
      minimum-idle: ${POSTGRES_MIN_IDLE:1}
      connection-timeout: ${POSTGRES_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${POSTGRES_IDLE_TIMEOUT:300000}
      max-lifetime: ${POSTGRES_MAX_LIFETIME:1200000}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: ${POSTGRES_SCHEMA:public}

  flyway:
    enabled: true
    baseline-on-migrate: false
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DATABASE:${POSTGRES_DB:readyroad_postgresql}}?sslmode=${POSTGRES_SSL_MODE:${POSTGRES_SSLMODE:disable}}&currentSchema=${POSTGRES_SCHEMA:public}
    user: ${POSTGRES_USERNAME:}
    password: ${POSTGRES_PASSWORD:}
    locations: classpath:db/migration-postgresql
    default-schema: ${POSTGRES_SCHEMA:public}
    schemas: ${POSTGRES_SCHEMA:public}
    create-schemas: true
    validate-on-migrate: true

readyroad:
  marketing:
    enabled: ${READYROAD_MARKETING_ENABLED:true}
    worker:
      poll-interval-ms: ${READYROAD_MARKETING_POLL_INTERVAL_MS:5000}
      batch-size: ${READYROAD_MARKETING_BATCH_SIZE:10}
      lock-ttl: ${READYROAD_MARKETING_LOCK_TTL:10m}
    analytics:
      service-account-file: ${GOOGLE_APPLICATION_CREDENTIALS:}
      ga4-account-id: ${MARKETING_GA4_ACCOUNT_ID:403159538}
      ga4-property-id: ${MARKETING_GA4_PROPERTY_ID:548176182}
      search-console-site-url: ${MARKETING_GSC_SITE_URL:sc-domain:readyroad.be}
    youtube:
      api-key: ${YOUTUBE_API_KEY:}
      channel-handle: ${MARKETING_YOUTUBE_CHANNEL_HANDLE:@RijBewijsBe}
      channel-id: ${MARKETING_YOUTUBE_CHANNEL_ID:UCs_IDQXCz6zADuHIdfS2C2w}
      channel-url: ${MARKETING_YOUTUBE_CHANNEL_URL:https://www.youtube.com/@RijBewijsBe/featured}
      monitoring-interval-hours: ${MARKETING_YOUTUBE_INTERVAL_HOURS:24}
      page-size: ${MARKETING_YOUTUBE_PAGE_SIZE:13}
