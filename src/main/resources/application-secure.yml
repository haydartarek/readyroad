# ========================================
# ReadyRoad - Secure/Production Profile
# ========================================

spring:
  application:
    name: readyroad-secure

  datasource:
    url: jdbc:mysql://localhost:3306/readyroad?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: intec-123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    mode: secure

server:
  port: 8890
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: WARN
    com.readyroad: INFO
    org.springframework.security: INFO

# JWT Configuration (ENABLED in Secure)
jwt:
  enabled: true
  secret-key: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351}
  expiration: 3600000  # 1 hour (أقصر في production)
  refresh-token:
    expiration: 604800000  # 7 days
  issuer: readyroad-backend
  header: Authorization
  prefix: Bearer

---
# IMPORTANT: In secure mode, JWT is REQUIRED for protected endpoints
