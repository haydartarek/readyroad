# ========================================
# ReadyRoad - Secure/Production Profile
# ========================================

spring:
  application:
    name: readyroad-secure

  datasource:
    url: jdbc:mysql://localhost:3306/readyroad_prod?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    url: jdbc:mysql://localhost:3306/readyroad_prod?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
    user: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  security:
    mode: secure

server:
  port: ${PORT:8890}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    root: WARN
    com.readyroad: INFO
    org.springframework.security: INFO

# Actuator - restrict to safe endpoints only
management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: false

# ========================================
# JWT Configuration (ENABLED in Secure)
# ========================================
jwt:
  enabled: true
  secret-key: ${JWT_SECRET:}
  expiration: 3600000 # 1 hour
  refresh-token:
    expiration: 604800000 # 7 days
  issuer: readyroad-backend
  header: Authorization
  prefix: Bearer

# ========================================
# CORS Configuration
# ========================================
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:8890
    max-age: 3600

  security:
    jwt:
      expiration: 3600000 # 1 hour
      issuer: readyroad-backend

---
# IMPORTANT: In secure mode, JWT is REQUIRED for protected endpoints
