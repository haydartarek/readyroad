spring:
  application:
    name: readyroad_prod

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:secure}

  security:
    mode: secure

  datasource:
    url: jdbc:mysql://localhost:3306/readyroad_prod?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&useUnicode=true
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:true}

  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: readyroad-scheduler-

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:8890}
    max-age: ${CORS_MAX_AGE:3600}
  mail:
    from: ${MAIL_FROM:noreply@readyroad.be}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

google:
  oauth:
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    token-uri: ${GOOGLE_OAUTH_TOKEN_URI:https://oauth2.googleapis.com/token}
    user-info-uri: ${GOOGLE_OAUTH_USER_INFO_URI:https://openidconnect.googleapis.com/v1/userinfo}

server:
  port: ${PORT:8890}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # Spring Boot 3.x error response properties
  error:
    include-message: on_param
    include-binding-errors: never
    include-exception: false
    include-stacktrace: never

logging:
  level:
    root: WARN
    com.readyroad: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN

# SpringDoc OpenAPI (Swagger) Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    default-models-expand-depth: -1
  show-actuator: true

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: "health,info" # Restricted: override in application-dev.yml if more are needed
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized # Never expose details to anonymous callers
      probes:
        enabled: true
  health:
    mail:
      enabled: false # Email credentials are optional; don't fail health check when SMTP is unconfigured
  info:
    env:
      enabled: false # Prevent env vars (including secrets) from appearing in /actuator/info

readyroad:
  upload:
    max-file-size-mb: 5
    directory: public/images/quiz
  study-reminder:
    enabled: true
    days-inactive: 3
    cooldown-hours: 24
    cron-expression: "0 0 10 * * *"

# Application Info (for /actuator/info)
info:
  app:
    name: ReadyRoad Backend API
    description: Backend API for ReadyRoad driving exam preparation platform
    version: 0.0.1-SNAPSHOT
    encoding: UTF-8
    java:
      version: ${java.version}
