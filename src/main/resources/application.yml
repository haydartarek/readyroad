spring:
  application:
    name: readyroad

  profiles:
    active: secure

  security:
    mode: secure

  datasource:
    url: jdbc:mysql://localhost:3306/readyroad?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: intec-123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false

server:
  port: 8890
  # ✅ Fixed: Use new Spring Boot 3.x properties
  error:
    include-message: always
    include-binding-errors: always
    include-exception: false
    include-stacktrace: on_param

logging:
  level:
    com.readyroad: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

# SpringDoc OpenAPI (Swagger) Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: alpha
    tags-sorter: alpha
    display-request-duration: true
    default-models-expand-depth: -1
  show-actuator: true

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"  # ✅ Enable all endpoints for development
      base-path: /actuator
  endpoint:
    health:
      show-details: always  # ✅ Always show health details
      probes:
        enabled: true
  info:
    env:
      enabled: true

# ReadyRoad Data Import Configuration
readyroad:
  data-import:
    enabled: false
    path: data

# Application Info (for /actuator/info)
info:
  app:
    name: ReadyRoad Backend API
    description: Backend API for ReadyRoad driving exam preparation platform
    version: 0.0.1-SNAPSHOT
    encoding: UTF-8
    java:
      version: ${java.version}
