# src/main/resources/application-prod.properties

# ???????????????????????????????????????????????????????
# ReadyRoad - Production Configuration
# ???????????????????????????????????????????????????????

# Server Configuration
server.port=8890
server.address=0.0.0.0

# Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:readyroad_prod}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Configuration (Production optimized)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
# ddl-auto=none: Flyway manages schema; Hibernate should NOT validate or modify
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.connection.characterEncoding=utf-8
spring.jpa.properties.hibernate.connection.CharSet=utf-8

# JWT Configuration
jwt.secret-key=${JWT_SECRET}
jwt.expiration=86400000
jwt.issuer=readyroad-backend

# Logging
logging.level.root=INFO
logging.level.com.readyroad=INFO
logging.file.name=logs/readyroad.log
logging.file.max-size=10MB
logging.file.max-history=30

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://rijvia.be,https://www.rijvia.be}
app.cors.max-age=3600

# Mail / SMTP Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=false

# App URLs
app.mail.from=${MAIL_FROM:info@rijvia.be}
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Signs import path (Docker volume mount)
readyroad.signs-import.path=/app/data/signs_import
