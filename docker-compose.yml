# ============================================
# RijVia - Local Docker Compose Configuration
# ============================================
# Services:
#   - postgres: PostgreSQL 16 database
#   - backend: Spring Boot application
#   - frontend: Next.js application
# ============================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16.13-alpine
    container_name: readyroad-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USERNAME:?POSTGRES_USERNAME must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      TZ: UTC

    expose:
      - "5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - readyroad-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: readyroad-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: secure,postgresql

      # Database Configuration
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME:?POSTGRES_USERNAME must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_SSLMODE: disable

      # Local-only Search Console workbook workspace. No publishing side effects.
      READYROAD_MARKETING_LOCAL_SEO_IMPORT_ENABLED: "true"

      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION: 86400000
      JWT_ISSUER: readyroad-backend

      # Admin Configuration
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?ADMIN_DEFAULT_PASSWORD must be set}

      # Java Options
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

      # Timezone
      TZ: UTC

      # Sign Quiz data path (mounted from host)
      READYROAD_SIGNS_IMPORT_PATH: /app/data/signs_import

      # Email / Password Reset
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: "587"
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-info@rijvia.be}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      # CORS — allowed origins for the backend API
      # Set CORS_ALLOWED_ORIGINS in .env to a comma-separated list of frontend origins.
      # Example: CORS_ALLOWED_ORIGINS=https://rijvia.be,https://www.rijvia.be
      # Falls back to localhost:3000 (development only) when not set.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      # Google OAuth / Social Login
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_TOKEN_URI: ${GOOGLE_OAUTH_TOKEN_URI:-https://oauth2.googleapis.com/token}
      GOOGLE_OAUTH_USER_INFO_URI: ${GOOGLE_OAUTH_USER_INFO_URI:-https://openidconnect.googleapis.com/v1/userinfo}

    expose:
      - "8890"

    volumes:
      - backend_logs:/app/logs
      - ./src/main/resources/data/signs_import:/app/data/signs_import:ro
      - ./public/images/signs:/app/public/images/signs:ro
      - sign_uploads:/app/public/images/quiz
      - article_uploads:/app/data/editorial-images

    networks:
      - readyroad-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8890/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s

  # Frontend Application (Next.js)
  frontend:
    build:
      context: ../readyroad_front_end/web_app
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8890/api
        NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
    container_name: readyroad-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    environment:
      # Runtime env — used by the BFF proxy (server-side only)
      BACKEND_URL: http://backend:8890/api
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      SMTP_USER: ${SMTP_USERNAME:-}
      SMTP_PASS: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${MAIL_FROM:-info@rijvia.be}
      CONTACT_TO: ${CONTACT_TO:-info@rijvia.be}
      NODE_ENV: production
      TZ: UTC

    ports:
      - "3000:3000"

    networks:
      - readyroad-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Networks
networks:
  readyroad-network:
    driver: bridge

# Volumes
volumes:
  postgres_data:
    external: true
    name: readyroad-postgresql_postgres_data
  backend_logs:
    driver: local
  article_uploads:
    driver: local
  sign_uploads:
    driver: local
