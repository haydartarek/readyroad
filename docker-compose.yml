# ============================================
# ReadyRoad - Docker Compose Configuration
# ============================================
# Services:
#   - mysql: MySQL 8 database
#   - backend: Spring Boot application
# ============================================

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: readyroad-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${DB_NAME:-readyroad_prod}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      TZ: UTC

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql/readyroad-init.sql:/docker-entrypoint-initdb.d/readyroad-init.sql:ro

    networks:
      - readyroad-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u $$MYSQL_USER --password=$$MYSQL_PASSWORD 2>/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max-connections=200
      - --sql-mode=NO_ENGINE_SUBSTITUTION

  # Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: readyroad-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      # Spring Profile
      SPRING_PROFILES_ACTIVE: prod

      # Database Configuration
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-readyroad_prod}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}

      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION: 86400000
      JWT_ISSUER: readyroad-backend

      # Admin Configuration
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?ADMIN_DEFAULT_PASSWORD must be set}

      # Java Options
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

      # Timezone
      TZ: UTC

      # Sign Quiz data path (mounted from host)
      READYROAD_SIGNS_IMPORT_PATH: /app/data/signs_import

      # Email / Password Reset
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@readyroad.be}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      # CORS — allowed origins for the backend API
      # Set CORS_ALLOWED_ORIGINS in .env to a comma-separated list of frontend origins.
      # Example: CORS_ALLOWED_ORIGINS=https://app.readyroad.be,https://www.readyroad.be
      # Falls back to localhost:3000 (development only) when not set.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}

      # Google OAuth / Social Login
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_TOKEN_URI: ${GOOGLE_OAUTH_TOKEN_URI:-https://oauth2.googleapis.com/token}
      GOOGLE_OAUTH_USER_INFO_URI: ${GOOGLE_OAUTH_USER_INFO_URI:-https://openidconnect.googleapis.com/v1/userinfo}

    ports:
      - "8890:8890"

    volumes:
      - backend_logs:/app/logs
      - ./src/main/resources/data/signs_import:/app/data/signs_import:ro
      - ./public/images/signs:/app/public/images/signs:ro
      - sign_uploads:/app/public/images/quiz

    networks:
      - readyroad-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8890/actuator/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s

  # Frontend Application (Next.js)
  frontend:
    build:
      context: ../readyroad_front_end/web_app
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8890/api
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8890
    container_name: readyroad-frontend
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    environment:
      # Runtime env — used by the BFF proxy (server-side only)
      BACKEND_URL: http://backend:8890/api
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8890
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      NODE_ENV: production
      TZ: UTC

    ports:
      - "3000:3000"

    networks:
      - readyroad-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# Networks
networks:
  readyroad-network:
    driver: bridge

# Volumes
volumes:
  mysql_data:
    driver: local
  backend_logs:
    driver: local
  sign_uploads:
    driver: local
